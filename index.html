function showErr(msg){
  try{
    const b=document.getElementById("errBanner"),t=document.getElementById("errText");
    if(b&&t){t.textContent=String(msg||"неизвестная ошибка");b.classList.add("show");}
    console.error("[kyiv-map error]",msg);
  }catch(e){}
}
window.addEventListener("error",(ev)=>{ showErr((ev&&ev.message)||"ошибка скрипта"); });

  return[lat,lon];

  const keys=[];
  for(const area of kyivAreas){keys.push({key:area.name.toLowerCase(),area});if(area.id)keys.push({key:area.id.toLowerCase(),area});}
  const seen=new Set();const uniq=[];
  for(const k of keys){if(seen.has(k.key))continue;seen.add(k.key);uniq.push(k);}
  return uniq.sort((a,b)=>b.key.length-a.key.length);
})();
function findKyivAreaInText(text){
  const low=(text||"").toLowerCase().replace(/[’`´]/g,"'");
  let best=null;
  for(const{key,area}of KYIV_AREA_KEYS){
    if(key.length<3)continue;
    const idx=low.indexOf(key);
    if(idx<0)continue;
    const before=idx>0?low[idx-1]:" ";
    const after=idx+key.length<low.length?low[idx+key.length]:" ";
    if(!(/[^а-яіїєґa-z]/i.test(before)||before===" "))continue;
    if(!(/[^а-яіїєґa-z]/i.test(after)||after===" "))continue;
    if(!best||idx<best.index){best={key:"kyiv_area:"+area.id,name:area.name,lat:area.lat,lon:area.lng,index:idx,length:key.length};}
  }
  return best;
}

  const kyiv=findKyivAreaInText(text);

function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371,toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function renderWarningsPanel(){
  const panel=$("warningsPanel"),list=$("warningsList"),cnt=$("warningsCount");
  if(!panel||!list||!cnt)return;
  const items=[...activeWarnings.values()].filter(w=>!w.dismissed);
  cnt.textContent=String(items.length);
  if(items.length===0){panel.classList.remove("show");list.innerHTML="";return;}
  panel.classList.add("show");
  list.innerHTML=items.map(w=>{
    const ww=w.warning;
    const t=new Date(w.lastSeen).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
    return `<div class="w-item"><div class="w-item-body">
      <div class="w-item-label">${esc(ww.label)}</div>
      <div class="w-item-detail">${esc(ww.detail)}</div>
      <div class="w-item-meta">Обновлено: ${t} · Источников: ${w.channels.size}</div>
    </div><button class="w-item-close" data-warn-id="${esc(ww.id)}">✕</button></div>`;
  }).join("");
  list.querySelectorAll(".w-item-close").forEach(b=>{
    b.addEventListener("click",(e)=>{e.preventDefault();e.stopPropagation();dismissWarning(b.getAttribute("data-warn-id"));});
  });
}
function dismissWarning(id){
  const w=activeWarnings.get(id);if(!w)return;
  w.dismissed=true;
  if(w.marker&&msgThreatLayer)try{msgThreatLayer.removeLayer(w.marker);}catch(e){}
  renderWarningsPanel();
}
function upsertWarning(ww,ch,msgMs){
  let w=activeWarnings.get(ww.id);
  if(!w){
    w={warning:ww,firstSeen:msgMs,lastSeen:msgMs,channels:new Set(),marker:null,dismissed:false};
    activeWarnings.set(ww.id,w);
    playAlertSound(true);
    addWarningMarker(w);
  }
  w.channels.add(ch);
  if(msgMs<w.firstSeen)w.firstSeen=msgMs;
  if(msgMs>w.lastSeen)w.lastSeen=msgMs;
}
function addWarningMarker(w){
  const ww=w.warning;
  const firstRegion=ww.regions[0];
  const rg=REGIONS.find(r=>r.name.toLowerCase().includes(firstRegion.toLowerCase().split(" ")[0]))||{lat:CONFIG.KYIV[0],lon:CONFIG.KYIV[1]};

let audioCtx=null,lastSoundAt=0;
function initAudio(){if(audioCtx)return audioCtx;try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}return audioCtx;}
function unlockAudio(){const ctx=initAudio();if(ctx&&ctx.state==="suspended")ctx.resume().catch(()=>{});}
function playBell(){
  if(!audioCtx)return;
  const now=audioCtx.currentTime;
  for(const p of [{f:880,g:.30,d:1.1},{f:1760,g:.14,d:.7},{f:2640,g:.07,d:.45}]){
    const o=audioCtx.createOscillator(),gn=audioCtx.createGain();
    o.type="sine";o.frequency.setValueAtTime(p.f,now);
    gn.gain.setValueAtTime(.0001,now);
    gn.gain.exponentialRampToValueAtTime(p.g,now+.012);
    gn.gain.exponentialRampToValueAtTime(.0001,now+p.d);
    o.connect(gn);gn.connect(audioCtx.destination);
    o.start(now);o.stop(now+p.d+.05);
  }
}
function playAlertSound(force){
  if(!CONFIG.SOUND_ENABLED)return;
  const now=Date.now();
  if(!force&&now-lastSoundAt<CONFIG.SOUND_COOLDOWN_MS)return;
  lastSoundAt=now;
  const ctx=initAudio();if(!ctx)return;
  try{if(ctx.state==="suspended")ctx.resume();playBell();}catch(e){}
}

/* ============================================================
   Карта
============================================================ */
let map=null;
try{map=L.map("map",{center:CONFIG.KYIV,zoom:8,zoomControl:true,attributionControl:true});}catch(e){showErr("Leaflet: "+(e&&e.message||e));}
let osmLayer=null;
if(map){osmLayer=L.tileLayer(CONFIG.TILE_URL,{maxZoom:19,attribution:CONFIG.TILE_ATTR});osmLayer.addTo(map);}
const threatLayer=map?L.layerGroup().addTo(map):null;
const msgThreatLayer=map?L.layerGroup().addTo(map):null;
const impactLayer=map?L.layerGroup().addTo(map):null;
const baseSat=map?L.layerGroup():null;
if(map){
  L.tileLayer(CONFIG.TILE_URL_SAT,{maxZoom:19,attribution:CONFIG.TILE_ATTR_SAT}).addTo(baseSat);
  L.tileLayer(CONFIG.TILE_URL_SAT_REF,{maxZoom:19,opacity:.9}).addTo(baseSat);
}
let currentBase="osm";
let ringsLayer=null;
if(map){
  ringsLayer=L.layerGroup().addTo(map);
  L.circle(CONFIG.KYIV,{radius:CONFIG.ZONE_RADIUS_KM*1000,color:"#3b82f6",weight:1.2,opacity:.75,fill:false,dashArray:"6 6",interactive:false}).addTo(ringsLayer);
  L.circle(CONFIG.KYIV_OBLAST_CENTER,{radius:CONFIG.KYIV_OBLAST_RADIUS_KM*1000,color:"#dc2626",weight:1.2,opacity:.75,fill:false,dashArray:"6 6",interactive:false}).addTo(ringsLayer);
}

/* ============================================================
   v14.28.1: прилёты/падения/сбития с ЦОД
============================================================ */
const impactReports=new Map();
function addImpactReportMarker(report,place,ch,msgMs){
  const key=`impact|${report.kind}|${place.key}`;
  let r=impactReports.get(key);
  if(!r){
    r={report,lat:place.lat,lon:place.lon,name:place.name,firstSeen:msgMs,lastSeen:msgMs,channels:new Set(),marker:null};
    impactReports.set(key,r);
    playAlertSound(true);
    addImpactMarker(r);
  }
  r.channels.add(ch);
  if(msgMs<r.firstSeen)r.firstSeen=msgMs;
  if(msgMs>r.lastSeen)r.lastSeen=msgMs;
  if(r.marker)try{r.marker.setPopupContent(buildImpactPopup(r));}catch(e){}
}
function addImpactMarker(r){
  const marker=L.marker([r.lat,r.lon],{
    icon:L.divIcon({className:"",html:`<div class="impact-marker ${r.report.kind}">${r.report.icon}</div>`,iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-17]}),
    zIndexOffset:880
  });
  marker.bindPopup(buildImpactPopup(r),{maxWidth:340,autoPan:true});
  marker.addTo(impactLayer);
  r.marker=marker;
}
function buildImpactPopup(r){
  const t=new Date(r.lastSeen).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  const chList=[...r.channels].map(ch=>`<span class="ch ${channelClass(ch)}">${esc(ch)}</span>`).join(" ");
  return `
    <div class="popup-title" style="color:${r.report.color}">${r.report.icon} ${esc(r.report.label)}</div>
    <div class="popup-warning" style="background:rgba(30,41,59,.6);color:${r.report.color}">
      Место: <b>${esc(r.name)}</b><br>
      Координаты: ${r.lat.toFixed(4)}, ${r.lon.toFixed(4)}<br>
      Источников: <b>${r.channels.size}</b>
    </div>
    <div class="popup-meta" style="margin-top:6px">Обновлено: ${t}</div>
    <div class="popup-channels"><b>Источники:</b><br>${chList}</div>
  `;
}
function processImpactReport(text,ch,msgMs){
  if(!text)return;
  const reports=detectImpactReports(text);
  if(reports.length===0)return;
  const report=reports[0];
  let place=null;
  const coords=parseCoordsFromText(text);
  if(coords){
    place={key:"coords:"+coords[0].toFixed(4)+","+coords[1].toFixed(4),name:"Точка "+coords[0].toFixed(3)+","+coords[1].toFixed(3),lat:coords[0],lon:coords[1]};
  } else {
    place=findImpactPlace(text);
  }
  if(!place)return;
  if(!inZone(place.lat,place.lon))return;
  if(report.kind==="clear"){ showToast("🟢 "+text.slice(0,80),2500); return; }
  addImpactReportMarker(report,place,ch,msgMs);
}

/* ============================================================
   Обработка сообщений
============================================================ */
const msgMarkers=new Map();
function syncMessageThreats(messages){
  const now=Date.now();
  for(let i=0;i<(messages||[]).length;i++){
    const m=messages[i];
    const text=m.text||"";
    const ch=(m.channel||"unknown").replace(/^@/,"").toLowerCase();
    const msgMs=m.date?Date.parse(m.date):now;

    /* 1) Warning */
    const warns=detectThreatWarnings(text);
    for(const w of warns) upsertWarning(w,ch,msgMs);

    /* 2) Прилёты/падения/сбития */
    processImpactReport(text,ch,msgMs);
  }
  /* Очистка impact */
  const cutoff=now-CONFIG.IMPACT_REPORT_TTL_MS;
  for(const[key,r]of[...impactReports]){
    if(r.lastSeen<cutoff){
      if(r.marker&&impactLayer)try{impactLayer.removeLayer(r.marker);}catch(e){}
      impactReports.delete(key);
    }
  }
  /* Очистка warnings */
  const warnCutoff=now-CONFIG.WARNING_GRACE_MS;
  for(const[id,w]of[...activeWarnings]){
    if(w.dismissed)continue;
    if(w.lastSeen<warnCutoff){
      if(w.marker&&msgThreatLayer)try{msgThreatLayer.removeLayer(w.marker);}catch(e){}
      activeWarnings.delete(id);
    }
  }
  renderWarningsPanel();
}

/* ============================================================
   Сеть
============================================================ */
let ws=null,wsConnected=false,wsReconnectMs=CONFIG.WS_RECONNECT_MS,wsReconnectTimer=null;
let pollTimer=null;
function wsScheduleReconnect(){
  if(wsReconnectTimer)return;
  wsReconnectTimer=setTimeout(()=>{wsReconnectTimer=null;wsConnect();},wsReconnectMs);
  wsReconnectMs=Math.min(wsReconnectMs*2,CONFIG.WS_RECONNECT_MAX_MS);
}
function wsConnect(){
  try{
    if(ws){try{ws.close();}catch(e){}ws=null;}
    ws=new WebSocket(CONFIG.WS_URL);
    ws.onopen=()=>{wsConnected=true;wsReconnectMs=CONFIG.WS_RECONNECT_MS;updateLiveBadge("ok");};
    ws.onmessage=(e)=>{try{JSON.parse(e.data);}catch(err){}};
    ws.onclose=()=>{wsConnected=false;ws=null;updateLiveBadge("err");wsScheduleReconnect();};
    ws.onerror=()=>{};
  }catch(e){wsScheduleReconnect();}
}
function updateLiveBadge(state){
  const badge=$("liveBadge");if(!badge)return;
  if(state==="ok"){badge.textContent=wsConnected?"онлайн · WS":"онлайн";badge.className="live-badge live"+(wsConnected?" ws":"");}
  else{badge.textContent="ошибка";badge.className="live-badge stale";}
}
async function fetchMessages(){
  try{
    const r=await fetch(CONFIG.API_MESSAGES);
    if(!r.ok)throw new Error("messages "+r.status);
    const data=await r.json();
    try{syncMessageThreats(data.messages||[]);}catch(e){}
    updateLiveBadge("ok");
  }catch(e){updateLiveBadge("err");}
}
function startPolling(){if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(fetchMessages,CONFIG.POLL_MS);}

/* ============================================================
   UI
============================================================ */
function clearAll(){
  impactReports.forEach(r=>{if(r.marker&&impactLayer)try{impactLayer.removeLayer(r.marker);}catch(e){}});
  impactReports.clear();
  activeWarnings.forEach(w=>{if(w.marker&&msgThreatLayer)try{msgThreatLayer.removeLayer(w.marker);}catch(e){}});
  activeWarnings.clear();
  renderWarningsPanel();
}
$("btnRefresh").addEventListener("click",()=>{unlockAudio();fetchMessages();showToast("Обновление…");});
$("btnClear").addEventListener("click",()=>{unlockAudio();clearAll();showToast("Очищено");});
$("btnAIExplain").addEventListener("click",()=>{unlockAudio();showAIExplain();});

(function initSoundToggle(){
  const btn=$("soundToggle");if(!btn)return;
  function upd(){btn.textContent=CONFIG.SOUND_ENABLED?"🔔":"🔕";btn.className="sound-btn "+(CONFIG.SOUND_ENABLED?"on":"muted");}
  upd();
  let lastTap=0;
  btn.addEventListener("click",(e)=>{
    e.preventDefault();e.stopPropagation();
    unlockAudio();
    const now=Date.now();
    playAlertSound(true);
    if(now-lastTap<500){CONFIG.SOUND_ENABLED=!CONFIG.SOUND_ENABLED;upd();lastTap=0;}
    else lastTap=now;
  });
})();
(function initColorToggle(){
  const btn=$("btnColorToggle");if(!btn)return;
  function upd(){
    const c=UAV_COLORS[uavColorIdx];
    btn.textContent="🎨";btn.style.background=c.hex;
    btn.style.borderColor=(c.id==="white")?"rgba(148,163,184,.5)":"rgba(0,0,0,.35)";
    btn.style.color=(c.id==="white"||c.id==="yellow")?"#1e293b":"#fff";
  }
  upd();
  btn.addEventListener("click",(e)=>{
    e.preventDefault();e.stopPropagation();
    uavColorIdx=(uavColorIdx+1)%UAV_COLORS.length;
    saveUavColor();upd();
    showToast("🎨 БПЛА: "+UAV_COLORS[uavColorIdx].name);
  });
})();
(function initRingsToggle(){
  const btn=$("btnRingsToggle");if(!btn||!map)return;
  try{const v=localStorage.getItem(RINGS_KEY);if(v==="0")ringsVisible=false;else if(v==="1")ringsVisible=true;}catch(e){}
  function app(){
    if(ringsVisible){if(!map.hasLayer(ringsLayer))ringsLayer.addTo(map);btn.classList.add("on");btn.classList.remove("off");}
    else{if(map.hasLayer(ringsLayer))map.removeLayer(ringsLayer);btn.classList.add("off");btn.classList.remove("on");}
  }
  app();
  btn.addEventListener("click",(e)=>{
    e.preventDefault();e.stopPropagation();
    ringsVisible=!ringsVisible;
    try{localStorage.setItem(RINGS_KEY,ringsVisible?"1":"0");}catch(e2){}
    app();
  });
})();
(function initBasemapToggle(){
  const btn=$("btnMapToggle");if(!btn||!map)return;
  btn.addEventListener("click",(e)=>{
    e.preventDefault();e.stopPropagation();
    unlockAudio();
    if(currentBase==="osm"){
      if(osmLayer)map.removeLayer(osmLayer);
      baseSat.addTo(map);currentBase="sat";
      btn.classList.add("on");
    }else{
      map.removeLayer(baseSat);
      osmLayer=L.tileLayer(CONFIG.TILE_URL,{maxZoom:19,attribution:CONFIG.TILE_ATTR});
      osmLayer.addTo(map);currentBase="osm";
      btn.classList.remove("on");
    }
  });
})();
function showAIExplain(){
  const lines=[];
  lines.push("⚠️ Активных предупреждений: "+[...activeWarnings.values()].filter(w=>!w.dismissed).length);
  for(const w of [...activeWarnings.values()].filter(w=>!w.dismissed)) lines.push("   • "+w.warning.label);
  lines.push("");
  lines.push("💥 Прилётов/падений: "+impactReports.size);
  for(const r of impactReports.values()) lines.push("   • "+r.report.icon+" "+r.name+" ("+r.lat.toFixed(3)+", "+r.lon.toFixed(3)+")");
  $("aiModalBody").textContent=lines.join("\n");
  $("aiModalTime").textContent="Обновлено: "+new Date().toLocaleTimeString("ru-RU");
  $("aiModalBackdrop").classList.add("show");
}
function hideAIExplain(){$("aiModalBackdrop").classList.remove("show");}
(function initAIModal(){
  const backdrop=$("aiModalBackdrop"),closeBtn=$("aiModalClose"),copyBtn=$("aiModalCopy");
  if(!backdrop)return;
  backdrop.addEventListener("click",(e)=>{if(e.target===backdrop)hideAIExplain();});
  if(closeBtn)closeBtn.addEventListener("click",hideAIExplain);
  document.addEventListener("keydown",(e)=>{if(e.key==="Escape"&&backdrop.classList.contains("show"))hideAIExplain();});
  if(copyBtn)copyBtn.addEventListener("click",async()=>{
    try{await navigator.clipboard.writeText($("aiModalBody").textContent||"");copyBtn.textContent="✅";setTimeout(()=>copyBtn.textContent="📋 Копировать",1500);}catch(e){}
  });
})();
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){if(pollTimer)clearInterval(pollTimer);}
  else{if(!pollTimer)startPolling();unlockAudio();}
});

(async function init(){
  try{
    loadUavColor();
    wsConnect();
    fetchMessages();
    startPolling();
    renderWarningsPanel();
    setTimeout(()=>unlockAudio(),500);
  }catch(e){showErr("init: "+(e&&e.message||e));}
})();
</script>
